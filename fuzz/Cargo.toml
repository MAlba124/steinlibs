[package]
name = "stein-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
stein-url.workspace = true
stein-xml.workspace = true
stein-http.workspace = true
stein-dns.workspace = true
stein-core.workspace = true
stein-arena.workspace = true
# with the byte at a time parser it is checked against
stein-json = { workspace = true, features = ["oracle"] }
stein-hash = { workspace = true, features = ["sha1x8"] }
fearless_simd.workspace = true
# Reference SHA-1 the stein one is checked against.
rustcrypto-sha1 = { package = "sha1", version = "0.11" }

[[bin]]
name = "url"
path = "fuzz_targets/url.rs"
test = false
doc = false
bench = false

